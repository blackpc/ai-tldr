name: Maintain LLMs + Tools (daily)

# Daily evergreen-catalog maintenance — SEPARATE from the 2h release sweep.
#
# Keeps the /models LLM registry and /learn/landscape (Tools) directory fresh:
# adds newly-shipped models + notable missing open-source tools, and applies
# verified price/benchmark/status changes to existing entries. Unlike the feed
# sweep these are evergreen pages, so there is NO 72h news cap.
#
# What it does:
#   1. Checks out the repo, installs deps
#   2. Builds THE tool candidate list (scripts/tool-gaps.ts →
#      .claude/tmp/tool-gaps.json): tools our own feed covered that the
#      catalogue lacks (no star floor) + ≥1k★ GitHub repos at the head of each
#      AI topic or created in the last year, minus catalogue-skips.json
#   3. Builds the registry-freshness context the agent reads (current flagship
#      per line) and prints both into the run summary
#   4. Runs Claude Code against prompts/maintain-registry.md (web-verify every
#      fact; add/update registry.json + landscape.json + per-entry detail files)
#   5. Runs `bun run build` to PROVE the new data validates (check-models +
#      check-landscape). If it doesn't, the job fails and nothing is committed.
#   6. Commits the allow-listed catalog files and pushes (rebase-with-retry)
#
# Required secret: CLAUDE_CODE_OAUTH_TOKEN (same as update-releases.yml).

on:
  schedule:
    # Every 6 hours at :30 — offset from the 2h feed sweep (minute 0). Was
    # daily; raised on 2026-09-05 so the ~160-tool feed backlog drains in
    # days, not months (SWEEP_MEMORY 2026-09-05-B). Drop back to daily once
    # tool-gaps.ts reports an empty fromFeed for a week.
    - cron: "30 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: maintain-registry
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    # One 80m sweep step (~8 tool pages at ~5 min each + the model check) +
    # ~15m for checkout / install / discovery / build / commit / push.
    timeout-minutes: 100

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the tool candidate list
        # Writes .claude/tmp/tool-gaps.json — fromFeed (tools our feed covered
        # that we don't list; no star floor) + fromGitHub (≥1k★, active or
        # created this year) minus catalogue-skips.json — and mirrors it into
        # the run summary. The feed half needs no network; if the GitHub
        # search fails the file is still written with fromFeed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '## Tool candidates (scripts/tool-gaps.ts)'
            echo '```'
            bun scripts/tool-gaps.ts 2>&1 || bun scripts/tool-gaps.ts --no-github 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test -f .claude/tmp/tool-gaps.json

      - name: Build registry-freshness context
        # Writes .claude/tmp/registry-context.json (current flagship per line)
        # the agent reads, and mirrors it into the run summary.
        run: |
          {
            echo '## Registry freshness (current flagship per line)'
            echo '```'
            bun scripts/registry-freshness.ts
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture current date
        id: now
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Run maintenance sweep with Claude Code
        uses: anthropics/claude-code-action@v1
        timeout-minutes: 80
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: "true"
          display_report: "true"
          prompt: |
            You are the AI/TLDR daily LLMs + Tools maintenance sweeper running
            in GitHub Actions. Working dir is the repo root.

            TODAY'S DATE IS ${{ steps.now.outputs.date }} (real UTC, not a
            fixture). Trust the system clock and what WebFetch returns even if
            releases look unfamiliar — your training data predates today.

            Read `prompts/maintain-registry.md` and follow it exactly. Verify
            every fact from a primary source. Models: if nothing has shipped,
            change nothing. Tools: work `.claude/tmp/tool-gaps.json` —
            `fromFeed` is a backlog of tools we already wrote news about, add
            every real one (up to ~8 this run), and record the non-tools in
            `src/data/learn/catalogue-skips.json`. Do NOT commit or push —
            the next workflow step does that.
          claude_args: |
            --model "claude-opus-5[1m]"
            --verbose
            --max-turns 6000
            --permission-mode acceptEdits
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Bash(bun:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(curl:*),Bash(gh:*),Bash(rm:*)"

      - name: Tool-backlog gate
        # Fails when feed-covered tools are still missing AND this run added
        # no tool page and recorded no skip — "a no-op day" with real
        # candidates pending (prompt prose alone was ignored 34 runs in a row,
        # SWEEP_MEMORY 2026-09-05-A). Recording a skip with a reason is a
        # valid outcome; the gate never demands a number.
        run: bun scripts/tool-gaps.ts --check --no-github

      - name: Validate the new catalog (gate)
        # Backstop: re-run the full build so check-models + check-landscape PROVE
        # the agent's edits are valid before we commit. A failure here fails the
        # job, so invalid data is never pushed. (Also regenerates derived files,
        # which the commit step discards.)
        run: bun run build

      - name: Commit and push if the catalog changed
        id: commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The evergreen catalog files only. Detail dirs catch new + modified
          # files; registry.json carries the build-derived current/rich flags.
          FILES="src/data/models/registry.json src/data/models/models src/data/learn/landscape.json src/data/learn/tools src/data/learn/catalogue-skips.json src/data/learn/github-stars.json public/models-media public/models-logos"
          if [[ -z "$(git status --porcelain $FILES)" ]]; then
            echo "No catalog changes — nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "ai-tldr-bot"
          git config user.email "41898282+ai-tldr-bot@users.noreply.github.com"
          git add $FILES
          git commit -m "feat(catalog): daily LLMs + Tools maintenance $(date -u +%Y-%m-%dT%H:%MZ)

          Added/updated models in src/data/models and tools in
          src/data/learn via prompts/maintain-registry.md (web-verified).

          Co-Authored-By: Claude Code Action <noreply@anthropic.com>"
          # The validation build regenerated DERIVED tracked files (stats.json,
          # models/count.json, learn/{count,article-images}.json). Discard every
          # stray unstaged change so the rebase starts clean — the intended files
          # are already in the commit. (Same guard as the feed sweep, 06-17-B.)
          git checkout -- . 2>/dev/null || true
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            git fetch "$REMOTE" "$GITHUB_REF_NAME"
            git rebase "FETCH_HEAD"
            if git push "$REMOTE" "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $attempt rejected — retrying after rebase."
            sleep 5
          done
          echo "Push failed after 5 attempts." >&2
          exit 1
