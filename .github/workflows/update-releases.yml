name: Update releases (every 2h)

# Runs the AI/TLDR daily release sweep on a schedule.
#
# What it does:
#   1. Checks out the repo
#   2. Installs Bun deps
#   3. Runs Claude Code with a short delegation prompt that reads
#      prompts/update-releases.md and follows it (web-fetch + verify
#      every URL/image, refresh src/data/releases.json)
#   4. Runs `bun run build` to confirm the new feed parses + page builds.
#      The build command is `tsc -b && vite build && bun scripts/prerender.ts`,
#      so it also generates per-release static HTML pages for SEO. The
#      `dist/` output is gitignored — only releases.json is committed;
#      Cloudflare Pages rebuilds and redeploys on every push to master.
#   5. If src/data/releases.json changed, commits + pushes back to master
#
# Required secret:
#   CLAUDE_CODE_OAUTH_TOKEN — generate locally with `claude setup-token`
#                              then `gh secret set CLAUDE_CODE_OAUTH_TOKEN`
#                              (or paste it in the GitHub UI)

on:
  schedule:
    # every 2 hours at minute 0
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # id-token: write is required by anthropics/claude-code-action@v1 — it
  # fetches an OIDC token from GitHub during setup. Without it the action
  # fails before Claude even starts: "Could not fetch an OIDC token."
  id-token: write

concurrency:
  group: update-releases
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Job cap is sized for 2 sweep attempts × 30m each + ~5m for
    # checkout / bun install / show-diff / commit / push. Each sweep
    # attempt has its OWN step-level timeout-minutes:30 so a silent
    # claude-code-action hang trips the step, not the whole job — that
    # lets the retry step actually run. (Observed failure mode: the SDK
    # sits idle for 25+ minutes after a 429 or even a clean 200 and
    # never recovers. Step-level timeout is the only safe escape.)
    timeout-minutes: 65

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # use default GITHUB_TOKEN; permissions: contents:write above
          # gives us push rights for the bot commit at the end

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh GitHub star counts
        # Re-fetch the live star counts shown on Learn tool-article GitHub
        # buttons so they stay current (prerendered into every deploy).
        # Uses the Actions GITHUB_TOKEN (~1000 req/h); non-destructive —
        # keeps previous counts for any repo that fails. Best-effort.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/refresh-learn-stars.ts

      - name: Discover missing popular tools (advisory)
        # Root-cause guard for the landscape: refresh-learn-stars only updates
        # stars of tools ALREADY listed — it never discovers new ones. This
        # diffs our list against GitHub's top-starred AI repos so a trending
        # tool can't sit at the top of GitHub while absent from our "complete"
        # landscape. Advisory only: prints the gap into the run summary, never
        # blocks the sweep. See scripts/discover-landscape-gaps.ts.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '## Landscape gap check (popular AI tools we are missing)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          GAP_MIN_STARS=15000 bun scripts/discover-landscape-gaps.ts >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Capture current date
        id: now
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Run release sweep with Claude Code (attempt 1)
        id: sweep1
        uses: anthropics/claude-code-action@v1
        # Step-level timeout: if the action hangs silently we want to
        # fail THIS step (so the retry step can run), not let the job
        # timeout kill everything. 30m gives healthy runs plenty of
        # headroom (observed p100 ~18m) while still catching hangs.
        timeout-minutes: 30
        # continue-on-error is what lets the retry step run after a
        # hang/failure. Without this, a step failure would short-circuit
        # the job and the retry would be skipped.
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Stream Claude's progress into the GH Actions log instead of
          # buffering until the run ends. show_full_output dumps the raw
          # CLI JSON, display_report posts a Step Summary at the end.
          show_full_output: "true"
          display_report: "true"
          # The real prompt is `prompts/update-releases.md` — Claude
          # reads it via its Read tool. Keep this shim minimal: anything
          # added here drifts from the canonical prompt.
          prompt: |
            You are the AI/TLDR scheduled release sweeper running in
            GitHub Actions. Working dir is the repo root.

            TODAY'S DATE IS ${{ steps.now.outputs.date }} (real UTC,
            not a fixture). Trust the system clock and what WebFetch
            returns even if releases look unfamiliar — your training
            data predates today.

            Read `prompts/update-releases.md` and follow it exactly.
            Do NOT commit or push — the next workflow step does that.
          claude_args: |
            --model "claude-opus-5[1m]"
            --verbose
            --max-turns 6000
            --permission-mode acceptEdits
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Bash(bun:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(rm:*)"

      - name: Reset working tree before retry
        # Attempt 1 may have written partial changes before hanging.
        # Revert tracked files to HEAD so attempt 2 starts clean — we
        # don't want attempt 2 to either see half-written JSON or fight
        # with duplicate sweep-report entries. The catalogue-sync step
        # (prompt step 7) may also have edited landscape/registry files
        # or created NEW tool/model detail JSONs — reset those too, and
        # git-clean the untracked ones (checkout can't remove new files).
        if: steps.sweep1.outcome == 'failure'
        run: |
          echo "::warning::Sweep attempt 1 failed or timed out — resetting and retrying."
          git checkout -- src/data/releases.json src/data/sweeps.json \
            src/data/learn/landscape.json src/data/learn/tools \
            src/data/models/registry.json src/data/models/models 2>/dev/null || true
          git clean -fd src/data/learn/tools src/data/models/models \
            public/models-logos public/models-media 2>/dev/null || true
          git status --short

      - name: Run release sweep with Claude Code (attempt 2)
        id: sweep2
        # Only runs if attempt 1 failed (timed out, errored, or hung
        # past the 30m step timeout). Same inputs, no continue-on-error
        # — if this one also fails, the job fails and the commit step
        # is skipped automatically (default if: success() gating).
        if: steps.sweep1.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        timeout-minutes: 30
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: "true"
          display_report: "true"
          prompt: |
            You are the AI/TLDR scheduled release sweeper running in
            GitHub Actions. Working dir is the repo root. THIS IS A
            RETRY — the previous attempt in this job failed or hung.
            The working tree was reset to HEAD; start fresh.

            TODAY'S DATE IS ${{ steps.now.outputs.date }} (real UTC,
            not a fixture). Trust the system clock and what WebFetch
            returns even if releases look unfamiliar — your training
            data predates today.

            Read `prompts/update-releases.md` and follow it exactly.
            When running `finalize-sweep.ts`, pass
            `--source github-actions-sweep-retry` so retries show up
            distinctly in /log. Do NOT commit or push — the next
            workflow step does that.
          claude_args: |
            --model "claude-opus-5[1m]"
            --verbose
            --max-turns 6000
            --permission-mode acceptEdits
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Bash(bun:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(rm:*)"

      - name: Show diff
        run: |
          echo "::group::git status"
          git status --short
          echo "::endgroup::"
          echo "::group::git diff src/data/releases.json"
          git --no-pager diff src/data/releases.json | head -200 || true
          echo "::endgroup::"

      - name: Catalogue-sync gate (tool items must be in the tools catalogue)
        # Mechanical enforcement of prompt step 7. Every tool/repo item this
        # sweep added must now be a landscape tile WITH a detail page whose
        # changelog links the item — or carry an explicit catalogue.skip in
        # the sweep report. 34 sweeps in a row reported "catalogue sync:
        # no-op, correctly" while shipping 27 tool items (SWEEP_MEMORY
        # 2026-09-05-A); prompt wording did not hold, so this validator
        # does. --write records the verified per-item resolution (added /
        # updated / skipped) into the sweep report as the audit trail.
        # A failure fails the job → nothing is committed → the next cron
        # re-sweeps (the items are still inside the 72h window).
        run: |
          {
            echo '## Catalogue-sync gate'
            echo '```'
            bun scripts/check-catalogue-sync.ts --write 2>&1 | tee /tmp/catalogue-gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # tee masks the exit code; re-run the check itself for the verdict.
          bun scripts/check-catalogue-sync.ts

      - name: Commit and push if the feed, sweep log, stars or catalogue changed
        id: commit
        env:
          # Pass the workflow's GITHUB_TOKEN explicitly. The Claude Code
          # action mutates git config during its run and the credential
          # helper installed by actions/checkout no longer applies — so
          # we embed the token directly in the push URL below.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Feed + sweep log + stars, PLUS the catalogue allowlist the
          # prompt's step 7 (catalogue sync) may touch: tool changelogs /
          # new tool pages (learn/tools, landscape.json), new model
          # versions (models/registry.json, models/models) and any brand
          # assets they need. Same allowlist shape as maintain-registry.yml.
          FILES="src/data/releases.json src/data/sweeps.json src/data/learn/github-stars.json src/data/learn/landscape.json src/data/learn/tools src/data/models/registry.json src/data/models/models public/models-media public/models-logos"
          if [[ -z "$(git status --porcelain $FILES)" ]]; then
            echo "No changes to the feed, sweep log, stars or catalogue — nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "ai-tldr-bot"
          git config user.email "41898282+ai-tldr-bot@users.noreply.github.com"
          git add $FILES
          git commit -m "feat(content): scheduled release sweep $(date -u +%Y-%m-%dT%H:%MZ)

          Refreshed src/data/releases.json and appended a sweep log
          entry to src/data/sweeps.json via prompts/update-releases.md.
          Also refreshed Learn GitHub star counts (github-stars.json)
          and synced the tools/LLM catalogues (changelogs, new entries)
          for items this sweep shipped.

          Co-Authored-By: Claude Code Action <noreply@anthropic.com>"
          # The sweep's validation build (`bun run build`) regenerates DERIVED,
          # tracked files from the new feed — src/data/stats.json (build-stats),
          # src/data/learn/{count,article-images}.json (check-learn). We do NOT
          # commit them from the sweep: Cloudflare's deploy build regenerates
          # them fresh from the pushed feed, so committing here only invites
          # rebase conflicts on generated JSON. Left unstaged, though, they make
          # `git rebase` below abort with "cannot rebase: You have unstaged
          # changes" and fail the whole sweep (the bug this guards against).
          # Discard every stray unstaged change so the rebase starts clean —
          # the intended files are already safely in the commit above.
          git checkout -- . 2>/dev/null || true
          # Push via tokenized HTTPS URL — survives any prior git config
          # mutation. Token is masked in logs by the runner.
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Sweeps run for ~8–10 min while other commits may land on
          # master. Rebase-with-retry so we don't lose a sweep to a
          # concurrent push.
          for attempt in 1 2 3 4 5; do
            git fetch "$REMOTE" "$GITHUB_REF_NAME"
            git rebase "FETCH_HEAD"
            if git push "$REMOTE" "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $attempt rejected — retrying after rebase."
            sleep 5
          done
          echo "Push failed after 5 attempts." >&2
          exit 1

      - name: Notify IndexNow of new URLs
        # After the sweep push (which triggers the Cloudflare deploy), tell
        # IndexNow (Bing/Yandex/Seznam/Naver — one call, all engines) about the
        # homepage, /stats, and the release pages added this sweep, so they
        # re-crawl promptly. Ownership is proved by public/<key>.txt (always
        # live). Only runs when something was actually pushed. Best-effort —
        # ping-indexnow.ts never throws.
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        run: bun scripts/ping-indexnow.ts
